name: Build API

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ESAPAPI.csproj

      - name: Build
        run: dotnet build ESAPAPI.csproj -c Release --no-restore

      - name: Publish
        run: dotnet publish ESAPAPI.csproj -c Release --no-build -o publish
